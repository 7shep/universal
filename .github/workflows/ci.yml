name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  PNPM_VERSION: 11.7.0
  NODE_VERSION: 22

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-node22-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create log directory
        run: mkdir -p .ci-logs

      - name: Check formatting
        run: pnpm format:check 2>&1 | tee .ci-logs/format-check.log

      - name: Lint
        run: pnpm lint 2>&1 | tee .ci-logs/lint.log

      - name: Typecheck
        run: pnpm typecheck 2>&1 | tee .ci-logs/typecheck.log

      - name: Test
        run: pnpm test 2>&1 | tee .ci-logs/test.log

      - name: Build
        run: pnpm build 2>&1 | tee .ci-logs/build.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: quality-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-logs/
            .turbo/runs/
            **/pnpm-debug.log
          if-no-files-found: warn
          retention-days: 7

  trusted-runtime-security:
    name: Trusted runtime and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-security-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-security-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-security-${{ runner.os }}-node22-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run trusted-runtime and security tests
        run: |
          mkdir -p .ci-logs
          pnpm test:trusted-runtime-security 2>&1 | tee .ci-logs/trusted-runtime-security.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: trusted-runtime-security-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-logs/
            .turbo/runs/
            **/pnpm-debug.log
          if-no-files-found: warn
          retention-days: 7
